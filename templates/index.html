<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapStudy — Your AI Study Buddy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><path d='M58,38 C46,32 28,28 10,33 L8,88 C28,84 46,84 58,92 Z' fill='%230A6847'/><path d='M62,38 C74,32 92,28 110,33 L112,88 C92,84 74,84 62,92 Z' fill='%230A6847'/><polygon points='66,8 52,38 60,38 48,72 74,30 64,30 74,8' fill='%23F5A623'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #0A6847;
            --green-dark: #054d34;
            --green-light: #4ADE80;
            --green-bubble: #DCF8C6;
            --gold: #F5A623;
            --bg: #ECE5DD;
            --card: #FFFFFF;
            --text: #1A1A2E;
            --text-light: #6B7280;
            --ai-bubble: #FFFFFF;
            --input-bg: #FFFFFF;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .dark {
            --bg: #0B141A;
            --card: #1E293B;
            --text: #E2E8F0;
            --text-light: #94A3B8;
            --ai-bubble: #1E293B;
            --green-bubble: #0A6847;
            --input-bg: #1E293B;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-info { flex: 1; }

        .header-name {
            font-size: 17px;
            font-weight: 700;
            color: white;
        }

        .header-name span { color: var(--gold); }

        .header-status {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
        }

        .header-status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--green-light);
            border-radius: 50%;
            margin-right: 4px;
        }

        .dark-toggle {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── CHAT AREA ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }

        /* ── MESSAGES ── */
        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            animation: msgIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--green-bubble);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }

        .message.ai .ai-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            margin-bottom: 4px;
        }

        .dark .message.ai .ai-label { color: var(--green-light); }

        .message .time {
            font-size: 10px;
            color: var(--text-light);
            text-align: right;
            margin-top: 4px;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
        }

        /* ── TYPING INDICATOR ── */
        .typing {
            align-self: flex-start;
            background: var(--ai-bubble);
            padding: 14px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
            display: none;
        }

        .typing.show { display: flex; gap: 5px; align-items: center; }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-light);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* ── QUICK ACTIONS ── */
        .quick-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 8px 16px;
            flex-shrink: 0;
        }

        .quick-btn {
            padding: 6px 14px;
            background: var(--card);
            border: 1.5px solid var(--green);
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: var(--green);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .quick-btn:active {
            background: var(--green);
            color: white;
        }

        .dark .quick-btn { border-color: var(--green-light); color: var(--green-light); }
        .dark .quick-btn:active { background: var(--green-light); color: var(--text); }

        /* ── INPUT AREA ── */
        .input-area {
            background: var(--card);
            padding: 10px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
            flex-shrink: 0;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .attach-btn:active { background: rgba(0,0,0,0.05); }

        .input-wrapper {
            flex: 1;
            background: var(--input-bg);
            border: 1.5px solid #ddd;
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .dark .input-wrapper { border-color: #334155; }
        .input-wrapper:focus-within { border-color: var(--green); }

        #msg-input {
            flex: 1;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text);
            background: transparent;
            resize: none;
            max-height: 100px;
            line-height: 1.4;
        }

        #msg-input::placeholder { color: var(--text-light); }

        .send-btn {
            width: 42px;
            height: 42px;
            background: var(--green);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { background: #ccc; cursor: default; }

        /* ── FILE PREVIEW ── */
        .file-preview {
            display: none;
            padding: 8px 16px;
            background: var(--card);
            border-top: 1px solid #eee;
        }

        .file-preview.show { display: flex; align-items: center; gap: 10px; }

        .file-preview img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

        .file-preview .file-info {
            flex: 1;
            font-size: 12px;
            color: var(--text-light);
        }

        .file-preview .file-name {
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
        }

        .file-preview .remove-file {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-light);
        }

        /* ── DATE DIVIDER ── */
        .date-divider {
            text-align: center;
            font-size: 11px;
            color: var(--text-light);
            background: rgba(0,0,0,0.04);
            padding: 4px 12px;
            border-radius: 8px;
            align-self: center;
            margin: 8px 0;
        }

        .dark .date-divider { background: rgba(255,255,255,0.05); }

        /* ── HIDDEN INPUTS ── */
        #file-input { display: none; }
        #camera-input { display: none; }

        /* ── ATTACH MENU ── */
        .attach-menu {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 16px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 8px;
            z-index: 200;
        }

        .attach-menu.show { display: flex; flex-direction: column; gap: 4px; }

        .attach-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border: none;
            background: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .attach-option:active { background: rgba(0,0,0,0.05); }
        .attach-option .icon { font-size: 20px; }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            z-index: 999;
            transition: transform 0.3s;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-avatar">
            <svg width="28" height="28" viewBox="0 0 120 120">
                <path d="M58,38 C46,32 28,28 10,33 L8,88 C28,84 46,84 58,92 Z" fill="white" opacity="0.9"/>
                <path d="M62,38 C74,32 92,28 110,33 L112,88 C92,84 74,84 62,92 Z" fill="white" opacity="0.7"/>
                <polygon points="66,8 52,38 60,38 48,72 74,30 64,30 74,8" fill="#F5A623"/>
            </svg>
        </div>
        <div class="header-info">
            <div class="header-name">Snap<span>Study</span></div>
            <div class="header-status"><span class="dot"></span>Online · Ready to help</div>
        </div>
        <button class="dark-toggle" onclick="toggleDark()">🌙</button>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chat-area">
        <div class="date-divider">Today</div>
    </div>

    <!-- TYPING INDICATOR -->
    <div class="typing" id="typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="quick-actions" id="quick-actions">
        <button class="quick-btn" onclick="sendQuick('Explain this topic like I am 5')">🧒 Explain simply</button>
        <button class="quick-btn" onclick="sendQuick('Quiz me on my last topic')">🧠 Quiz me</button>
        <button class="quick-btn" onclick="sendQuick('What are the likely exam questions?')">📝 Exam tips</button>
        <button class="quick-btn" onclick="sendQuick('Summarize my notes')">📖 Summarize</button>
    </div>

    <!-- ATTACH MENU -->
    <div class="attach-menu" id="attach-menu">
        <button class="attach-option" onclick="document.getElementById('camera-input').click(); closeAttachMenu();">
            <span class="icon">📸</span> Take Photo
        </button>
        <button class="attach-option" onclick="document.getElementById('file-input').click(); closeAttachMenu();">
            <span class="icon">📄</span> Upload File / PDF
        </button>
    </div>

    <!-- FILE PREVIEW -->
    <div class="file-preview" id="file-preview">
        <img id="preview-img" src="" alt="">
        <div class="file-info">
            <div class="file-name" id="preview-name"></div>
            <div id="preview-size"></div>
        </div>
        <button class="remove-file" onclick="removeFile()">✕</button>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
        <button class="attach-btn" onclick="toggleAttachMenu()">📎</button>
        <div class="input-wrapper">
            <textarea id="msg-input" rows="1" placeholder="Ask me anything..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- HIDDEN INPUTS -->
    <input type="file" id="file-input" accept="image/*,.pdf" onchange="handleFileSelect(this)">
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileSelect(this)">

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ── STATE ──
        let conversationHistory = [];
        let selectedFile = null;
        let isProcessing = false;

        // ── INIT ──
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('snapstudy_history');
            if (saved) {
                try {
                    conversationHistory = JSON.parse(saved);
                    conversationHistory.forEach(msg => {
                        addMessage(msg.content, msg.role, false);
                    });
                } catch(e) {}
            }

            if (conversationHistory.length === 0) {
                const welcome = "Hey there! 👋 I'm **SnapStudy**, your AI study buddy.\n\nI can help you with:\n\n📸 **Snap a photo** of your notes and I'll explain everything\n📄 **Upload a PDF** handout and I'll summarize it\n💬 **Ask me anything** about any course\n🧠 **Quiz you** on any topic\n\nJust type a question or tap the 📎 to upload a file. Let's ace those exams! ⚡";
                addMessage(welcome, 'ai', false);
            }

            scrollToBottom();
        });

        // ── DARK MODE ──
        function toggleDark() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.dark-toggle');
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('snapstudy_dark', document.body.classList.contains('dark'));
        }

        if (localStorage.getItem('snapstudy_dark') === 'true') {
            document.body.classList.add('dark');
            document.querySelector('.dark-toggle').textContent = '☀️';
        }

        // ── MESSAGES ──
        function addMessage(text, role, save = true) {
            const chatArea = document.getElementById('chat-area');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (role === 'ai') {
                const formatted = formatText(text);
                div.innerHTML = `<div class="ai-label">⚡ SnapStudy</div>${formatted}<div class="time">${time}</div>`;
            } else {
                div.innerHTML = `${escapeHtml(text)}<div class="time">${time} ✓✓</div>`;
            }

            chatArea.appendChild(div);
            scrollToBottom();

            if (save) {
                conversationHistory.push({ role, content: text });
                localStorage.setItem('snapstudy_history', JSON.stringify(conversationHistory.slice(-20)));
            }
        }

        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const chatArea = document.getElementById('chat-area');
            setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 100);
        }

        // ── SEND MESSAGE ──
        async function sendMessage() {
            if (isProcessing) return;

            const input = document.getElementById('msg-input');
            const text = input.value.trim();

            if (!text && !selectedFile) return;

            // Show user message
            if (text) addMessage(text, 'user');
            else addMessage('📎 [Uploaded a file]', 'user');

            input.value = '';
            autoResize(input);
            isProcessing = true;
            document.getElementById('send-btn').disabled = true;

            // Show typing
            const typing = document.getElementById('typing');
            typing.classList.add('show');
            scrollToBottom();

            // Hide quick actions after first message
            document.getElementById('quick-actions').style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('message', text);
                formData.append('history', JSON.stringify(conversationHistory.slice(-10)));

                if (selectedFile) {
                    formData.append('file', selectedFile);
                    removeFile();
                }

                const res = await fetch('/api/chat', { method: 'POST', body: formData });
                const data = await res.json();

                typing.classList.remove('show');
                addMessage(data.response, 'ai');

            } catch (err) {
                typing.classList.remove('show');
                addMessage("Sorry, I lost connection 😅 Check your internet and try again!", 'ai');
            }

            isProcessing = false;
            document.getElementById('send-btn').disabled = false;
        }

        function sendQuick(text) {
            document.getElementById('msg-input').value = text;
            sendMessage();
        }

        // ── FILE HANDLING ──
        function toggleAttachMenu() {
            document.getElementById('attach-menu').classList.toggle('show');
        }

        function closeAttachMenu() {
            document.getElementById('attach-menu').classList.remove('show');
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            selectedFile = file;
            const preview = document.getElementById('file-preview');
            const previewImg = document.getElementById('preview-img');
            const previewName = document.getElementById('preview-name');
            const previewSize = document.getElementById('preview-size');

            previewName.textContent = file.name;
            previewSize.textContent = (file.size / 1024).toFixed(0) + ' KB';

            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => { previewImg.src = e.target.result; };
                reader.readAsDataURL(file);
                previewImg.style.display = 'block';
            } else {
                previewImg.style.display = 'none';
            }

            preview.classList.add('show');
            closeAttachMenu();
            input.value = '';
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('file-preview').classList.remove('show');
        }

        // ── INPUT HELPERS ──
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 100) + 'px';
        }

        // ── TOAST ──
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Close attach menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.attach-btn') && !e.target.closest('.attach-menu')) {
                closeAttachMenu();
            }
        });
    </script>
</body>
</html>
